[package]
name = "aura"
version = "0.1.0"
edition = "2021"
description = "A gorgeous now-playing display for Spotify in your terminal: real album art, art-derived color themes, synced lyrics, and full playback control. Zero setup on macOS."
license = "MIT"
repository = "https://github.com/Zezoo123/aura"
readme = "README.md"
keywords = ["spotify", "tui", "terminal", "music", "ratatui"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
sha2 = "0.10"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
